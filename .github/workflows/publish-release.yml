name: Publish release

on:
  repository_dispatch:
    types: [server_complete]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify completed server run
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          script: |
            const release = require('./.github/scripts/tag-release.cjs');
            await release.verifyServerRun({ github, context });

      - name: Download server release result
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: Bannerlord-Coop-Team/BannerlordCoop.DedicatedServer
          run-id: ${{ github.event.client_payload.server_run_id }}
          name: release-result
          path: release-result

      - name: Verify assets, publish release and request promotion command
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          script: |
            const release = require('./.github/scripts/tag-release.cjs');
            await release.publish({ github, context });
